packages:
  - apps/*
  - packages/*
  - games/*
  - tools/*

catalog:
  # typescript-eslint supports TypeScript below 6.1, so stay on 6.0 until it catches up.
  typescript: ~6.0.0
  vite: ^8.3.5

# tsx needs esbuild's platform binary check. Anything new here should be reviewed first.
allowBuilds:
  esbuild: true
