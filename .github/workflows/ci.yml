name: CI

# This repo is public, so pull requests from forks run here too. They must stay on the
# pull_request trigger, which gives them no secrets and a read-only token.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from packageManager in package.json. Corepack left Node in version 25.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node with the pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determinism test
        run: pnpm exec vitest run packages/sim/src/toy.test.ts --testNamePattern determinism

      - name: Typecheck, lint, test, build and bundle-size report
        run: pnpm check
